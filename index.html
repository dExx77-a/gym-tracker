<!DOCTYPE html>
<!--
  Gym Tracker — runs fully offline. Just double-click this file.
  Everything (HTML, CSS, JS) is local. Data is saved in your browser's localStorage.
  Screens are drawn by the JavaScript files in /js/screens/ into <main id="view">.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a54f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Home-screen icon on iPhone (Safari > Share > Add to Home Screen) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">
  <title>Gym Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== ICON SPRITE =====
       Line icons drawn as SVG. Use them in JS with GT.ui.icon('name').
       To add an icon: copy a <symbol>, give it id="i-yourname", draw paths in a 24x24 box. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 5-7"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 10a6 6 0 0 1 9 0"/><path d="M12 10l1.5-2.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5l9 7-9 7z"/><path d="M18 5v14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5s5.5 4.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.8 1.6-4.6 1.6-4.6s.6 2.6 2.4 3.1C10.5 7.5 12 2.5 12 2.5z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4.5v1A3.5 3.5 0 0 0 8 10.5M16 6h3.5v1a3.5 3.5 0 0 1-3.5 3.5M12 13v4M8 21h8M9.5 17h5v4h-5z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6M9 8h3"/></symbol>
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h12l-2 4 2 4H5"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 5M22 9l-5 5"/></symbol>
  </svg>

  <!-- ===== TOP BAR: level badge, XP bar and streak (filled in by app.js) ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#me" class="lvl-badge" id="hdr-level" aria-label="Level">1</a>
      <div class="hdr-xp">
        <div class="hdr-row">
          <span id="hdr-rank" class="hdr-rank">Rookie</span>
          <span id="hdr-xp" class="hdr-xptext">0 / 100 XP</span>
        </div>
        <div class="xpbar"><div class="xpbar-fill" id="hdr-xpfill"></div></div>
      </div>
      <a href="#me" class="hdr-streak" aria-label="Streak">
        <svg class="icon"><use href="#i-flame"/></svg>
        <span id="hdr-streak-n">0</span>
      </a>
    </div>
  </header>

  <!-- ===== MAIN: the current screen is drawn in here ===== -->
  <main id="view" class="view"></main>

  <!-- ===== REST TIMER BAR (shown after you check a set) ===== -->
  <div id="timer" class="timerbar" hidden>
    <div class="timer-fill" id="timer-fill"></div>
    <div class="timer-inner">
      <svg class="icon"><use href="#i-clock"/></svg>
      <span class="timer-text" id="timer-text">1:30</span>
      <button class="btn btn-sm" data-timer="minus" aria-label="Minus 15 seconds">-15s</button>
      <button class="btn btn-sm" data-timer="plus" aria-label="Plus 15 seconds">+15s</button>
      <button class="btn btn-sm btn-primary" data-timer="skip">Skip</button>
    </div>
  </div>

  <!-- ===== BOTTOM TAB BAR ===== -->
  <nav class="tabbar">
    <a href="#today" data-tab="today"><svg class="icon"><use href="#i-home"/></svg><span>Today</span></a>
    <a href="#plan" data-tab="plan"><svg class="icon"><use href="#i-calendar"/></svg><span>Plan</span></a>
    <a href="#progress" data-tab="progress"><svg class="icon"><use href="#i-chart"/></svg><span>Progress</span></a>
    <a href="#body" data-tab="body"><svg class="icon"><use href="#i-scale"/></svg><span>Body</span></a>
    <a href="#me" data-tab="me"><svg class="icon"><use href="#i-user"/></svg><span>Me</span></a>
  </nav>

  <!-- Little pop-up messages appear here -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- ===== SCRIPTS (order matters: helpers first, app.js last) ===== -->
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/screens/today.js"></script>
  <script src="js/screens/workout.js"></script>
  <script src="js/screens/plan.js"></script>
  <script src="js/screens/progress.js"></script>
  <script src="js/screens/body.js"></script>
  <script src="js/screens/me.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
